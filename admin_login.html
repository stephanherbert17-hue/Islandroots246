<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IslandRootz246 • Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,rgba(85,210,197,.13),transparent 35%),radial-gradient(circle at 80% 0%,rgba(217,180,91,.14),transparent 32%),#061619;color:#f7f4ea;font-family:Inter,system-ui,sans-serif}
.wrap{width:min(460px,92%)}.brand{text-align:center;margin-bottom:25px}.mark{width:62px;height:62px;border:1px solid rgba(217,180,91,.7);border-radius:20px;display:grid;place-items:center;margin:auto;color:#f0d487;font-weight:900;background:rgba(217,180,91,.08)}.brand h1{font-family:Georgia,serif;margin:13px 0 4px;font-size:31px}.brand p{color:#9fb7b3;font-size:12px;letter-spacing:.15em;text-transform:uppercase}
.panel{background:rgba(13,41,45,.9);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:32px;box-shadow:0 30px 90px rgba(0,0,0,.4)}label{display:block;color:#c8d8d5;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin:0 0 7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.11);background:#06181b;color:#fff;outline:0;margin-bottom:17px}input:focus{border-color:#d9b45b}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,#d9b45b,#f0d487);color:#071719;font-weight:900}.err{display:none;color:#ffb4a8;background:rgba(180,50,40,.13);border:1px solid rgba(255,100,80,.2);padding:11px;border-radius:11px;margin-bottom:16px;font-size:13px}.back{text-align:center;margin-top:20px;color:#9fb7b3;font-size:13px}.back a{color:#f0d487}.security{margin-top:18px;color:#728e8b;font-size:10px;text-align:center}
</style></head>
<body><div class="wrap">
<div class="brand"><div class="mark">IR</div><h1>IslandRootz246</h1><p>Administration Portal</p></div>
<div class="panel"><div class="err" id="err">Incorrect login details.</div>
<form id="login"><label>Username</label><input id="user" autocomplete="username" required>
<label>Password</label><input id="pass" type="password" autocomplete="current-password" required>
<button class="btn">Sign in to Admin</button></form>
<div class="back"><a href="index.html">← Back to public website</a></div>
<div class="security">Static deployment mode • Replace client-side demo authentication with server authentication before production.</div>
</div></div>
<script>
if(localStorage.getItem("IR_ADMIN_SESSION")==="active") location.href="admin.html";
document.getElementById("login").addEventListener("submit",e=>{
 e.preventDefault();
 const u=document.getElementById("user").value,p=document.getElementById("pass").value;
 if(u==="islandrootzadmin"&&p==="Rootz246Admin!"){localStorage.setItem("IR_ADMIN_SESSION","active");location.href="admin.html"}
 else{document.getElementById("err").style.display="block"}
});
</script>
</body></html>
