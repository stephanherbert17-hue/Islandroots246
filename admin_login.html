<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IslandRootz246 Admin Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,rgba(47,196,178,.2),transparent 30%),radial-gradient(circle at 80% 70%,rgba(217,181,90,.16),transparent 30%),#071517;color:#f6f1e6;font-family:Inter,system-ui,sans-serif}.box{width:min(420px,88%);padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:25px;background:rgba(255,255,255,.055);backdrop-filter:blur(15px);box-shadow:0 25px 80px rgba(0,0,0,.4)}h1{margin:0 0 8px}.gold{color:#d9b55a}.muted{color:#aebfba}label{display:block;font-size:13px;font-weight:800;margin:17px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:#091d1f;color:white}.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:999px;background:#d9b55a;color:#111;font-weight:900;cursor:pointer}.note{font-size:12px;color:#8fa19c;margin-top:17px;line-height:1.5}</style></head>
<body><div class="box"><div style="font-weight:1000;letter-spacing:1px">ISLAND<span class="gold">ROOTZ</span>246</div><h1>Admin Control Centre</h1><p class="muted">Manage the website, bookings, services, team, business spotlight and visual themes.</p>
<form onsubmit="login(event)"><label>Username</label><input id="u" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><button class="btn">Enter Admin Panel</button></form>
<p class="note">Demo/static login gate for the current HTML build. For real multi-user secure authentication, connect the panel to a backend/auth provider.</p></div>
<script>function login(e){e.preventDefault();if(u.value==="islandrootzadmin"&&p.value==="Rootz246Admin!"){sessionStorage.setItem("ir246_admin","1");location.href="admin.html"}else alert("Incorrect login details.")}</script>
</body></html>
